<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breathe Block — interface preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    gap: 26px; padding: 32px 20px; background: #121412; color: #cfd6cf;
    font: 14px/1.5 ui-rounded, "Avenir Next", system-ui, sans-serif;
  }
  .stage { display: grid; justify-items: center; gap: 22px; }
  .bezel {
    width: min(466px, 82vw); aspect-ratio: 1; border-radius: 50%;
    background: #000; position: relative; overflow: hidden;
    box-shadow: 0 0 0 8px #191c19, 0 0 0 9px #2a2f2b, 0 26px 60px #0006;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    max-width: 520px; }
  button {
    font: inherit; color: #cfd6cf; background: #23272400; padding: 7px 14px;
    border: 1px solid #333a35; border-radius: 999px; cursor: pointer;
    transition: background .16s, border-color .16s;
  }
  button:hover { background: #232724; border-color: #4a544c; }
  button[aria-pressed="true"] { background: #2d332e; border-color: #66766a; }
  .readout { font-variant-numeric: tabular-nums; color: #7d8a80; letter-spacing: .06em; }
  .note { max-width: 520px; color: #6f7b72; font-size: 13px; text-align: center; }
  .note code { color: #94a39a; }
</style>
</head>
<body>
<div class="stage">
  <div class="bezel"><canvas id="screen" width="466" height="466"></canvas></div>
  <div class="controls">
    <button data-act="notice">a noticed session</button>
    <button data-act="manual">a session you started</button>
    <button data-act="tap">tap (check in, then 3-2-1)</button>
    <button data-act="heat">simulate rising stress</button>
    <button data-act="dismiss">dismiss</button>
    <button data-act="sleep">nobody there</button>
    <button data-act="wake">somebody there</button>
    <button data-act="palette">palette: ivory</button>
    <button data-act="loop" aria-pressed="false">loop the tour</button>
  </div>
  <div class="readout" id="readout">awakening</div>
  <p class="note">The same light field and state machine as the firmware, ported to canvas.
  <code>BreatheBlock/BreathScene.cpp</code> is the source of truth; if the two ever disagree,
  the firmware is right.</p>
</div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Light field — mirrors BreatheBlock/BreathField.cpp
// ---------------------------------------------------------------------------
const SIZE = 466, CENTER = 233, MAX_R = 340;

const PALETTES = {
  ivory:     { core: [255, 246, 232], halo: [122, 172, 160] },
  moonlight: { core: [236, 242, 255], halo: [108, 140, 186] },
  ember:     { core: [255, 234, 206], halo: [178, 126,  96] },
};
const PALETTE_NAMES = Object.keys(PALETTES);

const clamp01 = v => (v > 0 ? (v > 1 ? 1 : v) : 0);
const smoothstep = t => t * t * (3 - 2 * t);
const mix = (a, b, t) => a + (b - a) * t;

function bell(d, width) {
  if (width <= 0) return 0;
  const t = 1 - Math.abs(d) / width;
  return t <= 0 ? 0 : smoothstep(t);
}

function intensityAt(f, r) {
  let value = f.coreLevel * bell(r, f.coreRadius);
  const d = r - f.ringRadius;
  value += f.ringLevel * bell(d, d < 0 ? f.ringInnerWidth : f.ringOuterWidth);
  if (f.veilLevel > 0 && r < f.ringRadius) {
    value += f.veilLevel * smoothstep(clamp01((f.ringRadius - r) / f.veilFeather));
  }
  value += f.horizonLevel * bell(r - f.horizonRadius, f.horizonWidth);
  if (f.wellDepth > 0) value *= 1 - f.wellDepth * bell(r, f.wellRadius);
  return value > 1 ? 1 : value;
}

// One radius per pixel, computed once.
const radiusMap = new Uint16Array(SIZE * SIZE);
for (let y = 0; y < SIZE; y++) {
  for (let x = 0; x < SIZE; x++) {
    const dx = x - CENTER, dy = y - CENTER;
    radiusMap[y * SIZE + x] = Math.min(MAX_R, Math.round(Math.sqrt(dx * dx + dy * dy)));
  }
}

// Where a color heats toward as activation climbs: orange at the midpoint,
// red at the threshold itself. Two segments rather than one straight mix so
// the early climb (still well below the threshold) reads as a gentle warming
// rather than an immediate alarm color.
const ORANGE = [255, 140, 60], RED = [214, 64, 48];
function heatShift([r, g, b], heat) {
  if (heat <= 0.5) {
    const k = heat / 0.5;
    return [mix(r, ORANGE[0], k), mix(g, ORANGE[1], k), mix(b, ORANGE[2], k)];
  }
  const k = (heat - 0.5) / 0.5;
  return [mix(ORANGE[0], RED[0], k), mix(ORANGE[1], RED[1], k), mix(ORANGE[2], RED[2], k)];
}

const lut = new Uint8ClampedArray((MAX_R + 1) * 3);
function buildLut(field, palette) {
  const warm = field.warmth;
  const c = palette.core, h = palette.halo;
  let [cr, cg, cb] = [c[0] + 8 * warm, c[1], c[2] - 10 * warm];
  let [hr, hg, hb] = [h[0] + 12 * warm, h[1], h[2] - 12 * warm];
  // The ember visibly heating toward orange, then red, as activation climbs
  // toward its threshold — meant to be seen, unlike warmth above. The halo
  // only follows part of the way, so the ember stays the one thing that
  // clearly reddens rather than washing the whole glow in alarm color.
  const heat = clamp01(field.heat);
  if (heat > 0) {
    [cr, cg, cb] = heatShift([cr, cg, cb], heat);
    [hr, hg, hb] = heatShift([hr, hg, hb], heat * 0.45);
  }
  for (let r = 0; r <= MAX_R; r++) {
    const intensity = intensityAt(field, r);
    const k = clamp01(intensity * 1.15);
    lut[r * 3]     = (hr + (cr - hr) * k) * intensity;
    lut[r * 3 + 1] = (hg + (cg - hg) * k) * intensity;
    lut[r * 3 + 2] = (hb + (cb - hb) * k) * intensity;
  }
}

// ---------------------------------------------------------------------------
// Scene — mirrors BreatheBlock/BreathScene.cpp
// ---------------------------------------------------------------------------
const CFG = {
  inhaleMs: 4000, exhaleMs: 6000, breathCycles: 5,
  awakenMs: 2600, noticeMs: 5200, inviteMs: 3400, inviteTimeoutMs: 24000,
  releaseMs: 4600, dismissMs: 2000, sleepAfterMs: 180000,
  checkInMs: 6000, countdownStepMs: 1000,
  restCoreRadius: 38, restCoreLevel: 0.16,
  sleepCoreRadius: 24, sleepCoreLevel: 0.028,
  restActivationWarmth: 0.30,
  restActivationGrowth: 0.55, restActivationBrighten: 0.70,
  checkInCoreRadius: 64, checkInCoreLevel: 0.30,
  ringMinRadius: 100, ringMaxRadius: 184,
  ringOuterWidth: 20, ringOuterWidthFull: 28,
  ringInnerWidth: 22, ringInnerWidthFull: 14,
  horizonRadius: 204, horizonWidth: 22,
  wellRadius: 84, messageWellRadius: 118,
  showProgress: false,  // off by default: the contour stays a complete circle
};
const GEOMETRY_TAU = 110, LEVEL_TAU = 260, WARMTH_TAU = 340;
const INVISIBLE = 0.02, WORD_FADE = 800, WORD_GAP = 220, WELL_DEPTH = 0.9;
// "breathe with me" is fully gone by this point into Inviting (see its case
// in buildTarget). The gate a tap must wait for sits a little past that —
// wordEnvelope only reaches exactly zero *at* INVITE_WORD_CLEAR_MS, and
// step() checks state before rebuilding the frame, so a gate at that exact
// instant could still skip over the one frame that would have rendered the
// true zero. The margin guarantees that frame happens first.
const INVITE_WORD_CLEAR_MS = 3000, INVITE_TAP_GATE_MS = INVITE_WORD_CLEAR_MS + 200;

const TEXT = {
  shifted: 'your breathing\nhas shifted',
  invite: 'breathe with me',
  inhale: 'inhale', exhale: 'exhale', settled: 'settled',
};

// This standalone demo has no radar, so a tap's check-in shows this fixed,
// illustrative reading rather than anything live — same spirit as
// activationScore below.
const DEMO_HEART_RATE = 68, DEMO_BREATH_RATE = 13;

function ramp(t, from, to) {
  return to <= from ? (t >= to ? 1 : 0) : smoothstep(clamp01((t - from) / (to - from)));
}
function wordEnvelope(t, from, to) {
  if (t <= from || t >= to) return 0;
  return Math.min(smoothstep(clamp01((t - from) / WORD_FADE)),
                  smoothstep(clamp01((to - t) / WORD_FADE)));
}

function newField() {
  return {
    centerX: CENTER, centerY: CENTER,
    coreRadius: 5, coreLevel: 0,
    ringRadius: 40, ringOuterWidth: CFG.ringOuterWidth,
    ringInnerWidth: CFG.ringInnerWidth, ringLevel: 0,
    veilFeather: 74, veilLevel: 0,
    horizonRadius: CFG.horizonRadius, horizonWidth: CFG.horizonWidth, horizonLevel: 0,
    wellRadius: CFG.wellRadius, wellDepth: 0, warmth: 0, heat: 0,
  };
}

const scene = {
  state: 'awakening', stateAt: 0, lastAt: 0, lastPresence: 0,
  field: newField(), text: null, textOpacity: 0,
  progress: 0, progressOpacity: 0, progressShown: 0,
  releaseMs: CFG.releaseMs, releaseRing: 100, releaseLevel: 0, releaseVeil: 0,
  releaseOuter: CFG.ringOuterWidth, releaseInner: CFG.ringInnerWidth,
  drift: 1, dismissed: false, presence: true,
  // The detector's own smoothed, baseline-relative activation score (0 at
  // baseline, 1 at the real trigger threshold). This standalone demo has no
  // detector to drive it, so it stays at rest's neutral warmth — the field
  // math mirrors the firmware exactly regardless.
  activationScore: 0,
  // Snapshot at the moment a tap requests a check-in, so it holds still
  // while you read it.
  checkInHeartRate: 0, checkInBreathRate: 0,
  // A tap answering the invitation before "breathe with me" has safely
  // cleared can't take effect immediately — see handleTap — so it waits
  // here and is honoured the moment the word is gone.
  tapPending: false,
};

function enter(state, now) {
  // Only meaningful while actively in Inviting; leaving it any other way
  // (dismissed, or answered already) must not let a stale tap fire later.
  if (scene.state === 'inviting' && state !== 'guiding') scene.tapPending = false;
  if (state === 'releasing') {
    scene.releaseRing = scene.field.ringRadius;
    scene.releaseLevel = scene.field.ringLevel;
    scene.releaseVeil = scene.field.veilLevel;
    scene.releaseOuter = scene.field.ringOuterWidth;
    scene.releaseInner = scene.field.ringInnerWidth;
  }
  scene.state = state;
  scene.stateAt = now;
}

function beginGuidingFromInvite(now) {
  scene.tapPending = false;
  scene.dismissed = false;
  scene.progress = 0;
  enter('guiding', now);
}
const sessionActive = () =>
  ['noticing', 'inviting', 'guiding', 'releasing'].includes(scene.state);
// A requested glance at heart rate and breath rate, or the 3-2-1 before a
// session — a tap owns the screen either way.
const interactive = () => ['checking-in', 'countdown'].includes(scene.state);

function requestSession(now, announce) {
  if (sessionActive() || interactive()) return;
  scene.dismissed = false;
  scene.progress = 0;
  enter(announce ? 'noticing' : 'inviting', now);
}
function dismiss(now) {
  if (interactive()) { enter('resting', now); return; }
  if (!sessionActive() || scene.state === 'releasing') return;
  scene.dismissed = true;
  scene.releaseMs = CFG.dismissMs;
  enter('releasing', now);
}
// See BreathScene::handleTap: a tap from rest checks in; a second tap while
// checking in starts a 3-2-1 into breathing; a tap while an invitation is
// held answers it and begins. Anywhere else it's ignored.
function handleTap(now) {
  if (scene.state === 'resting') {
    scene.checkInHeartRate = DEMO_HEART_RATE;
    scene.checkInBreathRate = DEMO_BREATH_RATE;
    enter('checking-in', now);
  } else if (scene.state === 'checking-in') {
    enter('countdown', now);
  } else if (scene.state === 'inviting') {
    if (now - scene.stateAt >= INVITE_TAP_GATE_MS) {
      beginGuidingFromInvite(now);
    } else {
      // "breathe with me" is still on screen: begin the moment it clears
      // (see step()) rather than cutting it off mid-visibility.
      scene.tapPending = true;
    }
  }
}

const guideTotal = () => (CFG.inhaleMs + CFG.exhaleMs) * CFG.breathCycles;

function buildTarget(now) {
  const t = now - scene.stateAt;
  const target = newField();
  target.ringRadius = scene.field.ringRadius;
  let text = null, textOpacity = 0, wellRadius = CFG.wellRadius;
  let wantsProgress = 0, driftTarget = 1;
  let displayHeartRate = 0, displayBreathRate = 0, vitalsOpacity = 0;
  let heartbeatPulse = 0, countdownNumber = 0, countdownOpacity = 0;

  switch (scene.state) {
    case 'awakening': {
      const open = ramp(t, 0, 700), settle = ramp(t, 1200, CFG.awakenMs);
      target.coreRadius = mix(mix(5, 46, open), CFG.restCoreRadius, settle);
      target.coreLevel = mix(mix(0, 0.5, ramp(t, 0, 420)), CFG.restCoreLevel, settle);
      const wave = ramp(t, 520, 2200);
      target.ringRadius = mix(40, 214, wave);
      target.ringOuterWidth = mix(26, 48, wave);
      target.ringInnerWidth = mix(20, 34, wave);
      target.ringLevel = 0.30 * ramp(t, 460, 820) * (1 - wave);
      break;
    }
    case 'resting':
    case 'sleeping': {
      const asleep = scene.state === 'sleeping';
      const activation = asleep ? 0 : clamp01(scene.activationScore);
      const period = asleep ? 26000 : 16000;
      const breath = Math.sin(now * (2 * Math.PI / period));
      // The ember doesn't just warm as activation climbs — it visibly grows
      // and brightens too, so the approach to a session is unmistakable well
      // before one actually begins.
      const radius = (asleep ? CFG.sleepCoreRadius : CFG.restCoreRadius) *
                    (1 + CFG.restActivationGrowth * activation);
      const level = (asleep ? CFG.sleepCoreLevel : CFG.restCoreLevel) *
                   (1 + CFG.restActivationBrighten * activation);
      // Awake, the pulse is meant to be caught at a glance; asleep it stays
      // closer to imperceptible, since nobody's there to breathe with.
      const radiusDepth = asleep ? 0.16 : 0.32;
      const levelDepth = asleep ? 0.20 : 0.40;
      target.coreRadius = radius * (1 + radiusDepth * breath);
      target.coreLevel = level * (1 + levelDepth * breath);
      // A gentle warmth precursor to noticing — continuity, not an alert.
      target.warmth = asleep ? 0 : CFG.restActivationWarmth * activation;
      // Unlike warmth above, heat is meant to be seen: the ember's own
      // colour visibly climbing through orange toward red as activation
      // approaches the threshold that would start a session.
      target.heat = asleep ? 0 : activation;
      break;
    }
    case 'checking-in': {
      const fadeIn = ramp(t, 0, 500);
      const fadeOut = ramp(t, CFG.checkInMs - 600, CFG.checkInMs);
      const presence = fadeIn * (1 - fadeOut);

      // A brightening pulse timed to each detected heartbeat — a rhythm of
      // light standing in for a waveform we don't actually have.
      let beat = 0;
      if (scene.checkInHeartRate > 20 && scene.checkInHeartRate < 220) {
        const periodMs = 60000 / scene.checkInHeartRate;
        const phase = (t % periodMs) / periodMs;
        beat = phase < 0.08 ? smoothstep(phase / 0.08) : Math.exp(-5 * (phase - 0.08));
      }

      target.coreRadius = CFG.checkInCoreRadius;
      target.coreLevel = CFG.checkInCoreLevel * presence * (1 + 0.55 * beat);
      target.ringRadius = mix(CFG.ringMinRadius, CFG.checkInCoreRadius + 46, presence);
      target.ringLevel = 0.16 * presence * (1 + 0.35 * beat);
      target.veilLevel = 0.03 * presence;

      displayHeartRate = scene.checkInHeartRate;
      displayBreathRate = scene.checkInBreathRate;
      vitalsOpacity = presence;
      heartbeatPulse = beat;
      wellRadius = CFG.messageWellRadius;
      driftTarget = 0;
      break;
    }
    case 'countdown': {
      const stepMs = CFG.countdownStepMs;
      const stepIndex = Math.floor(t / stepMs);
      const withinStep = t % stepMs;

      // Continue from wherever the ring already was (check-in, or a direct
      // tap-tap from rest) and ease toward the floor of the breath, so
      // guidance picks it up smoothly with no reset.
      const settle = ramp(t, 0, stepMs * 2.6);
      target.ringRadius = mix(scene.field.ringRadius, CFG.ringMinRadius, settle);
      target.ringInnerWidth = CFG.ringInnerWidth;
      target.ringOuterWidth = CFG.ringOuterWidth;
      target.ringLevel = mix(0.16, 0.40, settle);
      target.veilLevel = mix(0.03, 0.05, settle);
      target.coreLevel = 0;

      // A soft breath for each number, its fall finishing well before the
      // step ends so there's a real span of true-zero opacity for the
      // content swap to land in — see BreathScene.cpp for why that margin
      // matters.
      const numberIn = ramp(withinStep, 0, 300);
      const numberOut = ramp(withinStep, 550, 850);
      countdownNumber = stepIndex < 3 ? 3 - stepIndex : 0;
      countdownOpacity = numberIn * (1 - numberOut);
      driftTarget = 0;
      break;
    }
    case 'noticing': {
      const bloom = ramp(t, 0, 1100), draw = ramp(t, 900, 4200);
      const fade = ramp(t, 4000, CFG.noticeMs);
      target.horizonRadius = mix(CFG.horizonRadius, 172, draw);
      target.horizonWidth = mix(CFG.horizonWidth, 30, draw);
      target.horizonLevel = 0.30 * bloom * (1 - fade);
      target.coreRadius = CFG.restCoreRadius;
      target.coreLevel = CFG.restCoreLevel * (1 - 0.55 * bloom);
      text = TEXT.shifted;
      textOpacity = wordEnvelope(t, 900, 4300);
      wellRadius = CFG.messageWellRadius;
      driftTarget = 0;
      break;
    }
    case 'inviting': {
      const form = ramp(t, 0, 900), settle = ramp(t, 1900, CFG.inviteMs);
      target.ringRadius = mix(mix(172, 148, form), CFG.ringMinRadius, settle);
      // A held invitation waits for a tap and isn't allowed to look frozen
      // while it does: a faint shimmer keeps it reading as alive.
      const shimmer = 1 + 0.05 * Math.sin(now * 0.0009);
      target.ringLevel = 0.42 * form * shimmer;
      target.veilLevel = 0.055 * form * shimmer;
      target.ringInnerWidth = CFG.ringInnerWidth;
      target.ringOuterWidth = CFG.ringOuterWidth;
      target.coreLevel = 0;
      text = TEXT.invite;
      textOpacity = wordEnvelope(t, 500, INVITE_WORD_CLEAR_MS);
      wellRadius = CFG.messageWellRadius;
      driftTarget = 0;
      break;
    }
    case 'guiding': {
      const cycleMs = CFG.inhaleMs + CFG.exhaleMs;
      const cycle = Math.floor(t / cycleMs), within = t % cycleMs;
      const inhaling = within < CFG.inhaleMs;
      let extension, phaseTime, phaseLength;
      if (inhaling) {
        phaseTime = within; phaseLength = CFG.inhaleMs;
        extension = smoothstep(clamp01(phaseTime / (phaseLength * 0.88)));
      } else {
        phaseTime = within - CFG.inhaleMs; phaseLength = CFG.exhaleMs;
        extension = 1 - smoothstep(clamp01(phaseTime / (phaseLength * 0.92)));
      }
      target.ringRadius = mix(CFG.ringMinRadius, CFG.ringMaxRadius, extension);
      target.ringInnerWidth = mix(CFG.ringInnerWidth, CFG.ringInnerWidthFull, extension);
      target.ringOuterWidth = mix(CFG.ringOuterWidth, CFG.ringOuterWidthFull, extension);
      target.ringLevel = (0.40 + 0.16 * extension) * (1 + 0.025 * Math.sin(now * 0.0011));
      target.veilLevel = 0.050 + 0.065 * extension;
      target.coreLevel = 0;
      target.warmth = -0.18 + 0.50 * extension;
      const scaffold = cycle <= 1 ? 1 : (cycle === 2 ? 0.5 : 0);
      text = inhaling ? TEXT.inhale : TEXT.exhale;
      textOpacity = scaffold * wordEnvelope(phaseTime, 0, phaseLength - WORD_GAP);
      scene.progress = clamp01(t / guideTotal());
      wantsProgress = CFG.showProgress ? 1 : 0;
      driftTarget = 0;
      break;
    }
    case 'releasing': {
      const d = scene.releaseMs, go = ramp(t, 0, d * 0.62);
      target.ringRadius = mix(scene.releaseRing, 208, go);
      target.ringOuterWidth = mix(scene.releaseOuter, 54, go);
      target.ringInnerWidth = mix(scene.releaseInner, 40, go);
      target.ringLevel = mix(scene.releaseLevel, 0, ramp(t, 0, d * 0.70));
      target.veilLevel = mix(scene.releaseVeil, 0, ramp(t, 0, d * 0.45));
      target.coreRadius = CFG.restCoreRadius;
      target.coreLevel = CFG.restCoreLevel * ramp(t, d * 0.45, d);
      if (!scene.dismissed) {
        text = TEXT.settled;
        textOpacity = wordEnvelope(t, 600, 3200);
      }
      driftTarget = 0;
      break;
    }
  }

  // The light steps aside wherever there's something to read — a word, the
  // check-in numbers, or a countdown digit.
  const protectiveOpacity = Math.max(textOpacity, vitalsOpacity, countdownOpacity);
  target.wellRadius = wellRadius;
  target.wellDepth = WELL_DEPTH * protectiveOpacity;
  scene.drift += (driftTarget - scene.drift) * (1 / (1 + 260 / 40)) * 0.25;
  target.centerX = CENTER + scene.drift * 5 * Math.sin(now * 0.00017);
  target.centerY = CENTER + scene.drift * 4 * Math.sin(now * 0.000119 + 1.1);

  scene.text = text;
  scene.textOpacity = textOpacity;
  scene.progressOpacity = wantsProgress;
  scene.displayHeartRate = displayHeartRate;
  scene.displayBreathRate = displayBreathRate;
  scene.vitalsOpacity = vitalsOpacity;
  scene.heartbeatPulse = heartbeatPulse;
  scene.countdownNumber = countdownNumber;
  scene.countdownOpacity = countdownOpacity;
  return target;
}

function approach(field, target, dtMs) {
  const gk = dtMs / (GEOMETRY_TAU + dtMs);
  const lk = dtMs / (LEVEL_TAU + dtMs);
  const wk = dtMs / (WARMTH_TAU + dtMs);
  const chase = (key, k) => { field[key] += (target[key] - field[key]) * k; };

  chase('centerX', gk); chase('centerY', gk);
  if (field.coreLevel < INVISIBLE) field.coreRadius = target.coreRadius;
  else chase('coreRadius', gk);
  if (field.ringLevel < INVISIBLE && field.veilLevel < INVISIBLE) {
    field.ringRadius = target.ringRadius;
    field.ringOuterWidth = target.ringOuterWidth;
    field.ringInnerWidth = target.ringInnerWidth;
  } else {
    chase('ringRadius', gk); chase('ringOuterWidth', gk); chase('ringInnerWidth', gk);
  }
  if (field.horizonLevel < INVISIBLE) {
    field.horizonRadius = target.horizonRadius;
    field.horizonWidth = target.horizonWidth;
  } else { chase('horizonRadius', gk); chase('horizonWidth', gk); }
  chase('wellRadius', gk);
  field.veilFeather = target.veilFeather;
  chase('coreLevel', lk); chase('ringLevel', lk); chase('veilLevel', lk);
  chase('horizonLevel', lk); chase('warmth', wk); chase('heat', wk);
  field.wellDepth = target.wellDepth;
}

function step(now) {
  let dt = now - scene.lastAt;
  if (dt < 1) dt = 1; if (dt > 200) dt = 200;
  scene.lastAt = now;
  if (scene.presence) scene.lastPresence = now;

  const t = now - scene.stateAt;
  switch (scene.state) {
    case 'awakening': if (t >= CFG.awakenMs) enter('resting', now); break;
    case 'resting':
      if (!scene.presence && now - scene.lastPresence >= CFG.sleepAfterMs)
        enter('sleeping', now);
      break;
    case 'sleeping': if (scene.presence) enter('resting', now); break;
    case 'checking-in': if (t >= CFG.checkInMs) enter('resting', now); break;
    case 'countdown':
      if (t >= CFG.countdownStepMs * 3) {
        scene.dismissed = false;
        scene.progress = 0;
        enter('guiding', now);
      }
      break;
    case 'noticing': if (t >= CFG.noticeMs) enter('inviting', now); break;
    case 'inviting':
      // Waits for a tap (see handleTap) rather than starting on its own; an
      // unanswered invitation withdraws quietly, no closing word, but at the
      // same unhurried pace as a completed session — nothing was refused.
      if (scene.tapPending && t >= INVITE_TAP_GATE_MS) {
        beginGuidingFromInvite(now);
      } else if (t >= CFG.inviteTimeoutMs) {
        scene.dismissed = true;
        scene.releaseMs = CFG.releaseMs;
        enter('releasing', now);
      }
      break;
    case 'guiding':
      if (t >= guideTotal()) { scene.releaseMs = CFG.releaseMs; enter('releasing', now); }
      break;
    case 'releasing':
      if (t >= scene.releaseMs) { scene.dismissed = false; enter('resting', now); }
      break;
  }
  approach(scene.field, buildTarget(now), dt);
  scene.progressShown += (scene.progressOpacity - scene.progressShown) *
                         (dt / (LEVEL_TAU + dt));
}

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const image = ctx.createImageData(SIZE, SIZE);
const pixels = image.data;
for (let i = 3; i < pixels.length; i += 4) pixels[i] = 255;

let paletteIndex = 0;

function draw() {
  buildLut(scene.field, PALETTES[PALETTE_NAMES[paletteIndex]]);
  const cx = Math.round(scene.field.centerX), cy = Math.round(scene.field.centerY);
  const shiftX = cx - CENTER, shiftY = cy - CENTER;
  for (let y = 0; y < SIZE; y++) {
    // The ember drifts a few pixels; clamping the lookup rather than shifting
    // the whole map keeps this a single pass.
    const my = Math.min(SIZE - 1, Math.max(0, y - shiftY));
    const rowOut = y * SIZE, rowMap = my * SIZE;
    for (let x = 0; x < SIZE; x++) {
      const mx = Math.min(SIZE - 1, Math.max(0, x - shiftX));
      const out = (rowOut + x) * 4;
      const r = radiusMap[rowMap + mx] * 3;
      pixels[out] = lut[r];
      pixels[out + 1] = lut[r + 1];
      pixels[out + 2] = lut[r + 2];
    }
  }
  ctx.putImageData(image, 0, 0);

  if (scene.progressShown > 0.01 && scene.progress > 0) {
    ctx.save();
    ctx.strokeStyle = `rgba(201,214,206,${0.18 * scene.progressShown})`;
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, 223, -Math.PI / 2,
            -Math.PI / 2 + 2 * Math.PI * scene.progress);
    ctx.stroke();
    ctx.restore();
  }

  if (scene.text && scene.textOpacity > 0.004) {
    const lines = scene.text.split('\n');
    const single = lines.length === 1 && !lines[0].includes(' ');
    ctx.save();
    ctx.font = `300 ${single ? 30 : 25}px ui-rounded, "Avenir Next", system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(242,245,241,${0.91 * scene.textOpacity})`;
    ctx.letterSpacing = '5px';
    const top = CENTER - 21 * (lines.length - 1);
    lines.forEach((line, i) => ctx.fillText(line, CENTER, top + i * 42));
    ctx.restore();
  }

  // The check-in numbers and the countdown digits — never shown at once.
  if (scene.vitalsOpacity > 0.004) {
    const lines = [`${Math.round(scene.displayHeartRate)} bpm`,
                   `${Math.round(scene.displayBreathRate)} / min`];
    ctx.save();
    ctx.font = '300 25px ui-rounded, "Avenir Next", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(242,245,241,${0.91 * scene.vitalsOpacity})`;
    ctx.letterSpacing = '3px';
    lines.forEach((line, i) => ctx.fillText(line, CENTER, CENTER - 21 + i * 42));
    ctx.restore();
  } else if (scene.countdownOpacity > 0.004) {
    ctx.save();
    ctx.font = '300 30px ui-rounded, "Avenir Next", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(242,245,241,${0.91 * scene.countdownOpacity})`;
    ctx.fillText(String(scene.countdownNumber), CENTER, CENTER);
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
const readout = document.getElementById('readout');
// Inviting now waits for a tap rather than starting itself (see handleTap),
// so the automated tour answers its own invitation a couple of seconds after
// the ring settles — otherwise it would just sit there for inviteTimeoutMs.
let pendingTapAt = 0;
const tour = [
  { gapMs: 6000, run: now => {} },
  { gapMs: 500, run: now => { requestSession(now, true); pendingTapAt = now + CFG.noticeMs + 2000; } },
  { gapMs: 4000, run: now => {} },
  { gapMs: 500, run: now => { requestSession(now, false); pendingTapAt = now + 2000; } },
  { gapMs: 4000, run: now => {} },
  { gapMs: 7000, run: now => { scene.presence = false; scene.lastPresence = now - CFG.sleepAfterMs; } },
  { gapMs: 5000, run: now => { scene.presence = true; } },
];
let looping = false, tourStep = 0, tourAt = 0;

// Drives scene.activationScore from wherever it is up to the trigger
// threshold over HEAT_RAMP_MS, so the ember's warming, growth and colour
// are all visible without needing real radar hardware — the same score
// StressEngine would compute from a sustained relative shift.
const HEAT_RAMP_MS = 8000;
let heatRamping = false, heatRampFrom = 0, heatRampAt = 0;

document.querySelector('.controls').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  const now = performance.now();
  switch (button.dataset.act) {
    case 'notice': looping = false; requestSession(now, true); break;
    case 'manual': looping = false; requestSession(now, false); break;
    case 'tap': looping = false; handleTap(now); break;
    case 'heat':
      looping = false;
      heatRamping = scene.state === 'resting';
      heatRampFrom = scene.activationScore;
      heatRampAt = now;
      break;
    case 'dismiss': dismiss(now); break;
    case 'sleep': scene.presence = false; scene.lastPresence = now - CFG.sleepAfterMs; break;
    case 'wake': scene.presence = true; break;
    case 'palette':
      paletteIndex = (paletteIndex + 1) % PALETTE_NAMES.length;
      button.textContent = 'palette: ' + PALETTE_NAMES[paletteIndex];
      break;
    case 'loop':
      looping = !looping; tourStep = 0; tourAt = now;
      button.setAttribute('aria-pressed', String(looping));
      break;
  }
});

function frame(now) {
  if (looping && !sessionActive()) {
    if (now - tourAt >= tour[tourStep].gapMs) {
      tourAt = now;
      tourStep = (tourStep + 1) % tour.length;
      tour[tourStep].run(now);
    }
  } else if (looping) {
    tourAt = now;
  }
  if (pendingTapAt && now >= pendingTapAt) { pendingTapAt = 0; handleTap(now); }
  if (heatRamping) {
    if (scene.state !== 'resting') {
      heatRamping = false;  // no longer resting to warm up in
    } else {
      const k = clamp01((now - heatRampAt) / HEAT_RAMP_MS);
      scene.activationScore = heatRampFrom + (1 - heatRampFrom) * k;
      if (k >= 1) {
        heatRamping = false;
        scene.activationScore = 0;
        requestSession(now, true);  // the same sustained-shift trigger StressEngine fires
      }
    }
  }
  step(now);
  draw();
  readout.textContent = scene.state +
    (scene.state === 'guiding'
       ? '  ·  ' + Math.round(scene.progress * 100) + '%'
       : '');
  requestAnimationFrame(frame);
}

scene.lastAt = performance.now();
scene.stateAt = scene.lastAt;
scene.lastPresence = scene.lastAt;
requestAnimationFrame(frame);
</script>
</body>
</html>
